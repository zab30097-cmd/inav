name: Build Custom Target

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Build DARWINFPVF435AIO
        run: |
          mkdir build
          cd build
          cmake -GNinja ..
          ninja DARWINFPVF435AIO

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DARWINFPVF435AIO-firmware
          path: build/*.hex
